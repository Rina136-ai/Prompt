<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <title>Music-to-Story Video AI</title>
  <link rel="stylesheet" href="/static/styles.css" />
</head>
<body>
  <header>
    <h1>🎬 Music-to-Story Video AI</h1>
    <p id="provider-banner"></p>
  </header>

  <main>
    <section id="mode-select">
      <h2>1. Mode de création</h2>
      <div class="mode-grid" id="mode-grid"></div>
    </section>

    <section id="inputs">
      <h2>2. Contenu source</h2>
      <label>Paroles
        <textarea id="lyrics" rows="10" placeholder="Colle les paroles ici (laisse une ligne vide entre chaque couplet/refrain)"></textarea>
      </label>
      <label>Genre musical
        <select id="genre">
          <option value="afrobeat">Afrobeat</option>
          <option value="makossa">Makossa</option>
          <option value="jazz">Jazz</option>
          <option value="soul">Soul</option>
          <option value="gospel">Gospel</option>
          <option value="rnb">R&amp;B</option>
          <option value="pop" selected>Pop</option>
          <option value="rock">Rock</option>
          <option value="zouk">Zouk</option>
          <option value="reggae">Reggae</option>
          <option value="salsa">Salsa</option>
        </select>
      </label>
      <div class="upload-row">
        <label>Audio (MP3/WAV, optionnel)
          <input type="file" id="audio-file" accept="audio/*" />
        </label>
        <span id="audio-status"></span>
      </div>
      <div class="upload-row" id="character-row" style="display:none;">
        <label>Image du personnage principal
          <input type="file" id="character-file" accept="image/*" />
        </label>
        <span id="character-status"></span>
      </div>
    </section>

    <section id="director">
      <h2>3. Directeur artistique</h2>
      <div class="director-grid" id="director-grid"></div>
    </section>

    <section id="actions">
      <button id="build-storyboard">Générer le storyboard</button>
    </section>

    <section id="storyboard-output" hidden>
      <h2>4. Storyboard</h2>
      <p id="storyboard-summary"></p>
      <div id="scenes"></div>

      <h2>5. Contenus multiples générés à partir de ce titre</h2>
      <div id="output-plan"></div>
    </section>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
